<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>pixel_city prototype2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1e26;color:#eef2f8;font:13px system-ui,sans-serif}canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}canvas.drag{cursor:grabbing}.panel{position:fixed;background:#161a22e8;border:1px solid #39404e;border-radius:8px;padding:10px 12px;backdrop-filter:blur(8px)}#hud{left:12px;top:12px}h1{font-size:15px;margin:0 0 5px}.dim{color:#98a2b3;font-size:11px}label{display:block;margin-top:7px}input{accent-color:#7fd0b0}#zoom{left:12px;bottom:12px;display:flex;gap:4px}button{background:#29313d;border:1px solid #46505e;border-radius:4px;color:inherit;padding:6px 12px;cursor:pointer}#load{position:fixed;inset:0;display:grid;place-items:center;background:#1a1e26}.warn{color:#ffd27d}
</style>
</head>
<body><canvas id="map"></canvas>
<div id="hud" class="panel"><h1>서울 도심 AI 픽셀 지도</h1><div class="dim">AI 재질 · 실제 좌표 정보 레이어</div><label>지도 스타일 <select id="style" aria-label="지도 스타일"></select></label><label><input id="poi" type="checkbox" checked> POI·지하철 표시</label><div id="status" class="dim"></div></div>
<div id="zoom" class="panel"><button id="out">−</button><button id="in">＋</button></div><div id="load">지도 불러오는 중…</div>
<script src="app.js"></script></body></html>
